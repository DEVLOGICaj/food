<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مطعم</title>

<style>
body {
    font-family: Arial;
    background:#f5f5f5;
}

h1 {
    text-align:center;
}

.container {
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.card {
    background:white;
    width:250px;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 10px #ccc;
}

.card img {
    width:200px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

.price {
    color:green;
    font-size:20px;
}
</style>

</head>

<body>

<h1>قائمة الطعام</h1>

<div class="container" id="foodContainer"></div>


<script src="food.js"></script>

<script>

let box = document.getElementById("foodContainer");


food.forEach(item => {

    box.innerHTML += `

    <div class="card">

        <img src="${item.image}"
        onerror="this.style.display='none'">

        <h2>${item.name}</h2>

        <p class="price">
        ${item.price}
        </p>

    </div>

    `;

});

</script>


</body>
</html>
