<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قائمة طعام المطعم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fff5f5;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        header {
            background: #e53e3e;
            color: white;
            border-bottom: 4px solid #c53030;
            text-align: center;
            padding: 25px 15px;
            margin-bottom: 30px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(229, 62, 62, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #fed7d7;
            font-size: 1.05rem;
        }

        .main-content {
            width: 100%;
            max-width: 1100px;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #feb2b2;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .product-img-container {
            width: 100%;
            height: 170px;
            background: #fff0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a202c;
        }

        .product-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid #edf2f7;
            padding-top: 12px;
        }

        .product-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e53e3e;
        }

        .qty-container {
            display: flex;
            align-items: center;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            overflow: hidden;
        }

        .qty-btn {
            background: #feb2b2;
            color: #742a2a;
            border: none;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-value {
            padding: 0 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
        }

        .actions-row {
            display: flex;
            gap: 8px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            flex: 1;
            text-align: center;
        }

        .cart-btn {
            background: linear-gradient(135deg, #e53e3e, #c53030);
        }

        .cart-float-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .cart-action-btn {
            background: linear-gradient(135deg, #dd6b20, #c05621);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 10px rgba(221, 107, 32, 0.3);
        }

        .send-cart-btn {
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #ffffff;
            border: 1px solid #feb2b2;
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 450px;
            color: #2d3748;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e53e3e;
        }

        .close-modal {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
            gap: 10px;
        }

        .remove-item-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .modal-footer {
            border-top: 1px solid #edf2f7;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
            color: #e53e3e;
        }

        footer {
            background-color: #2d3748;
            color: #ffffff;
            width: 100%;
            padding: 40px 20px 20px;
            margin-top: 50px;
            border-top: 4px solid #e53e3e;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .footer-content {
            max-width: 800px;
            margin-bottom: 20px;
        }

        .footer-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fc8181;
        }

        .footer-desc {
            color: #cbd5e0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .footer-bottom {
            border-top: 1px solid #4a5568;
            width: 100%;
            padding-top: 15px;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>قائمة طعام المطعم</h1>
        <p class="subtitle">أشهى الوجبات والمأكولات الطازجة بانتظارك</p>
    </header>

    <div class="main-content">
        <div class="grid-container" id="products-container"></div>

        <div class="cart-float-container" id="cart-section" style="display: none;">
            <button onclick="showCartModal()" class="cart-action-btn">
                🛍️ عرض محتويات السلة وحساب المجموع
            </button>
            <button onclick="sendCart()" class="send-cart-btn">
                🛒 إرسال السلة الكاملة عبر واتساب
            </button>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>محتويات السلة</span>
                <button class="close-modal" onclick="closeCartModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-cart-items"></div>
            <div class="modal-footer">
                <span>المجموع الكلي:</span>
                <span id="modal-total-price">0</span>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-title">مطعمنا المميز</div>
            <div class="footer-desc">نعمل على تقديم أفضل المأكولات والوجبات السريعة بأعلى معايير الجودة والسرعة في تلبية الطلبات عبر واتساب.</div>
        </div>
        <div class="footer-bottom">
            جميع الحقوق محفوظة © 2026
        </div>
    </footer>
    <!-- ربط ملف الـ JavaScript (food.js) -->
    <script src="food.js"></script>
     <script> 
         console.log(food);
     </script>

    <script>
        const container = document.getElementById("products-container");
        const cartSection = document.getElementById("cart-section");
        const cartModal = document.getElementById("cartModal");
        const modalCartItems = document.getElementById("modal-cart-items");
        const modalTotalPrice = document.getElementById("modal-total-price");
        const ownerPhone = "963946887715";
        let cart = [];

        function increaseQty(id) {
            let qtyEl = document.getElementById("qty-" + id);
            let current = parseInt(qtyEl.innerText);
            qtyEl.innerText = current + 1;
        }

        function decreaseQty(id) {
            let qtyEl = document.getElementById("qty-" + id);
            let current = parseInt(qtyEl.innerText);
            if (current > 1) {
                qtyEl.innerText = current - 1;
            }
        }

        function sendWhatsApp(name, price, id) {
            let qty = parseInt(document.getElementById("qty-" + id).innerText);
            let message = encodeURIComponent(`مرحباً، أريد طلب هذه الوجبة:\nالاسم: ${name}\nالسعر: ${price}\nالكمية: ${qty}`);
            let whatsappUrl = `https://wa.me/${ownerPhone}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        function addToCart(name, price, id) {
            let qty = parseInt(document.getElementById("qty-" + id).innerText);
            let numericPrice = parseFloat(price.replace(/[^0-9.]/g, '')) || 0;

            let item = cart.find(x => x.name == name);

            if (item) {
                item.qty += qty;
            } else {
                cart.push({
                    name: name,
                    priceStr: price,
                    priceNum: numericPrice,
                    qty: qty
                });
            }

            updateCartUI();
            alert("تمت إضافة الوجبة إلى السلة بنجاح! 🛒");
        }

        function updateCartUI() {
            if (cart.length > 0) {
                cartSection.style.display = "flex";
            } else {
                cartSection.style.display = "none";
                closeCartModal();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            if (cart.length > 0) {
                showCartModal();
            }
        }

        function showCartModal() {
            if (cart.length == 0) {
                alert("السلة فارغة!");
                closeCartModal();
                return;
            }

            modalCartItems.innerHTML = "";
            let total = 0;

            cart.forEach((p, index) => {
                let itemTotal = p.priceNum * p.qty;
                total += itemTotal;

                modalCartItems.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${p.name}</strong><br>
                            <span style="color: #718096; font-size: 0.85rem;">الكمية: ${p.qty} | السعر: ${itemTotal}</span>
                        </div>
                        <button class="remove-item-btn" onclick="removeFromCart(${index})">حذف</button>
                    </div>
                `;
            });

            modalTotalPrice.innerText = total;
            cartModal.style.display = "flex";
        }

        function closeCartModal() {
            cartModal.style.display = "none";
        }

        function sendCart() {
            if (cart.length == 0) {
                alert("السلة فارغة!");
                return;
            }

            let text = "مرحباً، أريد طلب وجبات المطعم التالية:\n\n";
            let total = 0;

            cart.forEach((p, i) => {
                let itemTotal = p.priceNum * p.qty;
                total += itemTotal;
                text += `${i + 1}- ${p.name}\nالكمية: ${p.qty}\nالسعر: ${p.priceStr}\n------------------\n`;
            });

            text += `\nالمجموع الكلي: ${total}`;

            let whatsappUrl = `https://wa.me/${ownerPhone}?text=` + encodeURIComponent(text);
            window.open(whatsappUrl, '_blank');
        }

        // مطبق خصيصاً على حقول جدول food: f_id, f_name, f_price, f_image
        if (typeof products !== "undefined" && products.length > 0) {
            container.innerHTML = "";
            products.forEach((p, index) => {
                let imagePath = p.f_image && p.f_image.trim() !== "" ? p.f_image : "https://via.placeholder.com/300x180?text=No+Image";
                let productId = p.f_id !== undefined ? p.f_id : index;

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <img src="${imagePath}" alt="${p.f_name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                        </div>
                        <div class="product-content">
                            <div class="product-title">${p.f_name}</div>
                            <div class="product-footer">
                                <div class="product-info-row">
                                    <span class="price">${p.f_price}</span>
                                    <div class="qty-container">
                                        <button class="qty-btn" onclick="decreaseQty(${productId})">-</button>
                                        <span class="qty-value" id="qty-${productId}">1</span>
                                        <button class="qty-btn" onclick="increaseQty(${productId})">+</button>
                                    </div>
                                </div>
                                <div class="actions-row">
                                    <button onclick="addToCart('${p.f_name}', '${p.f_price}', ${productId})" class="buy-btn cart-btn">
                                        أضف للسلة
                                    </button>
                                    <button onclick="sendWhatsApp('${p.f_name}', '${p.f_price}', ${productId})" class="buy-btn">
                                        شراء مباشر
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = `<div class="empty-state">لا توجد وجبات مطروحة حالياً. تأكد من جلب البيانات وتصديرها لتظهر هنا.</div>`;
        }
    </script>

</body>
</html>
